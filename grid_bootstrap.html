<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Replica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      .layout-container {
        border: 2px solid magenta;
        background-color: #cfe2f3;
        max-width: 800px;
        margin: 0 auto;
      }

      .row-section {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.5rem;
      }

      .border-bottom-black {
        border-bottom: 2px solid black;
      }

      .border-right-black {
        border-right: 2px solid black;
      }

      .h-header {
        height: 100px;
      }
      .h-nav {
        height: 60px;
      }
      .h-main {
        height: 350px;
      }
      .h-footer {
        height: 80px;
      }

      .text-header {
        color: red;
      }
      .text-nav {
        color: blue;
      }
      .text-sidenav {
        color: orange;
      }
      .text-main {
        color: limegreen;
      }
      .text-footer {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid layout-container p-0">
      <div class="row m-0">
        <div
          class="col-12 row-section h-header border-bottom-black text-header"
        >
          Header
        </div>
      </div>

      <div class="row m-0">
        <div class="col-12 row-section h-nav border-bottom-black text-nav">
          Nav
        </div>
      </div>

      <div class="row m-0 h-main border-bottom-black">
        <div class="col-4 row-section border-right-black text-sidenav h-100">
          SideNav
        </div>

        <div class="col-8 row-section text-main h-100">Main</div>
      </div>

      <div class="row m-0">
        <div class="col-12 row-section h-footer text-footer">Footer</div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
