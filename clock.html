<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>


    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        height: 100vh;
        background: linear-gradient(to bottom, #2c6aa0, #eaeaea);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      #clock {
        font-size: 8rem;
        font-weight: 600;
      }

      #date {
        font-size: 1.5rem;
      }

      .top-links {
        position: absolute;
        top: 20px;
        left: 30px;
      }

      .format-btns {
        position: absolute;
        top: 20px;
        right: 30px;
      }
    </style>
  </head>

  <body>
   
    <div class="top-links">
      <p class="mb-1">Digital Clock Home</p>
      <p>Back</p>
    </div>

  
    <div class="format-btns">
      <button class="btn btn-secondary btn-sm" onclick="setFormat(24)">
        24h
      </button>
      <button class="btn btn-primary btn-sm" onclick="setFormat(12)">
        12h
      </button>
    </div>


    <div class="text-center">
      <div id="clock"></div>
      <div id="date" class="mt-3"></div>
    </div>

    <script>
      let format = 12;

      function setFormat(type) {
        format = type;
      }

      function updateClock() {
        let d = new Date();

        let hours = d.getHours();
        let minutes = d.getMinutes();
        let seconds = d.getSeconds();
        let ampm = "";

        if (format === 12) {
          ampm = hours >= 12 ? " pm" : " am";
          hours = hours % 12;
          hours = hours ? hours : 12;
        }

      
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        document.getElementById("clock").innerHTML =
          hours + ":" + minutes + ":" + seconds + ampm;

      
        let options = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        };
        document.getElementById("date").innerHTML = d.toLocaleDateString(
          "en-US",
          options,
        );
      }

      setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
</html>
