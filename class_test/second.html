<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .green-box {
        background-color: #80ff72;
        border: 1px solid #333;
        padding: 20px;
        text-align: center;
        font-weight: bold;
        height: 100%;
      }

      .spacer {
        margin-top: 15px;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body class="p-4">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="green-box py-4">Header</div>
        </div>
      </div>

      <div class="row spacer">
        <div class="col-3">
          <div
            class="green-box d-flex align-items-center justify-content-center"
          >
            Side Bar
          </div>
        </div>

        <div class="col-9">
          <div class="row mb-3">
            <div class="col-12">
              <div class="green-box py-5">Content 1</div>
            </div>
          </div>

          <div class="row">
            <div class="col-6">
              <div class="green-box py-5">Content 2</div>
            </div>
            <div class="col-6">
              <div class="green-box py-5">Content 3</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="green-box py-4">Footer</div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
